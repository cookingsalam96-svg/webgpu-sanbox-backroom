evidence_classes:
  E1: {name: experimentally_verified, meaning: directly supported by experimental results and independently source-traceable}
  E2: {name: mathematically_derived, meaning: supported by documented reproducible calculations}
  E3: {name: engineering_analogy, meaning: proposed software interpretation, not a source claim}
  E4: {name: unverified_hypothesis, meaning: requires further validation}
  E5: {name: simulated, meaning: generated by a software model and not a hardware measurement}
